# =======================================================
# Prometheus Configuration (Đề 9 E-Commerce)
# Scrape Targets: cAdvisor, Prometheus, Backend, Loki, MySQL, Nginx, Node Exporter
# =======================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # 1. cAdvisor (Container Resource Metrics - CPU, RAM, Network, FS)
  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          environment: 'production'
          role: 'container-metrics'

  # 2. Prometheus Self-Monitoring (TSDB, Scrapes, Memory, Internal Health)
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'production'
          role: 'monitoring-system'

  # 3. Web Backend API (Express / Node.js HTTP Requests, Latency, Orders, Revenue)
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3000']
        labels:
          environment: 'production'
          role: 'backend-api'
          app: 'ecommerce-web'

  # 4. Grafana Loki Log Engine Metrics (Ingestion Rate, Streams, Storage TSDB)
  - job_name: 'loki'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['loki:3100']
        labels:
          environment: 'production'
          role: 'logging-engine-metrics'

  # 5. MySQL Database Exporter (Connections, Queries/sec, Buffer Pool, Slow Queries)
  - job_name: 'mysql'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mysqld_exporter:9104']
        labels:
          environment: 'production'
          role: 'database-metrics'

  # 6. Nginx Web Server Exporter (Active Connections, Requests/sec, Handled)
  - job_name: 'nginx'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nginx_exporter:9113']
        labels:
          environment: 'production'
          role: 'reverse-proxy-metrics'

  # 7. Host Node Exporter (OS System Metrics: Host CPU, Memory, Disk)
  - job_name: 'node-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          environment: 'production'
          role: 'host-metrics'
