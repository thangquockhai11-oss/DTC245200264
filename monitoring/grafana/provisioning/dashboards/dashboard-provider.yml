# =======================================================
# Grafana Dashboard Provider Configuration (Đề 9)
# Tự động nạp toàn bộ dashboard JSON từ /var/lib/grafana/dashboards
# =======================================================

apiVersion: 1

providers:
  - name: 'ElectroShop Monitoring'
    orgId: 1
    folder: 'ElectroShop Monitoring'
    folderUid: 'electroshop'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
