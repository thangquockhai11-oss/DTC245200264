# =======================================================
# Grafana Dashboard Provider Configuration (Đề 9)
# Tự động nạp tất cả dashboard JSON trong thư mục này
# =======================================================

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'ElectroShop Monitoring'
    folderUid: 'electroshop'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
