# =======================================================
# Grafana Datasources Provisioning (Đề 9 E-Commerce)
# Auto-provisioning Prometheus (Metrics) and Loki (Logs)
# =======================================================

apiVersion: 1

datasources:
  # 1. Prometheus Metrics Datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  # 2. Loki Centralized Logs Datasource
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
