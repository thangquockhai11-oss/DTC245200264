# =======================================================
# Promtail Log Shipper Configuration (Đề 9)
# Ships logs to Grafana Loki from Docker Containers (via Docker socket)
# Note: Nginx logs are symlinked to /dev/stdout, so we use Docker SD instead
# =======================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker Service Discovery - Thu thập log từ tất cả container qua Docker socket
  # Hoạt động được kể cả khi Nginx log là symlink tới /dev/stdout
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Lấy tên container (bỏ dấu / ở đầu)
      - source_labels:
          - __meta_docker_container_name
        regex: "/(.*)"
        target_label: container
      # Lấy stream (stdout/stderr)
      - source_labels:
          - __meta_docker_container_log_stream
        target_label: stream
      # Lấy image name
      - source_labels:
          - __meta_docker_container_image
        target_label: image
      # Lấy compose service name nếu có
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service
    pipeline_stages:
      - docker: {}

  # Web App file logs (nếu app ghi ra file thật trong /app/logs)
  - job_name: ecommerce-web-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: ecommerce-web
          app: electroshop
          container: ecommerce-web
          env: production
          __path__: /var/log/app/*.log

