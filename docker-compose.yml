version: '3.8'

# =======================================================
# Đề 9 - Website Thương mại điện tử (E-commerce)
# Bước 3: Tích hợp Hệ thống Gom Log Tập Trung Loki + Promtail
# =======================================================

services:
  # 1. Node.js Express Web Application
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ecommerce-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-shop_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ShopUserPass123!}
      DB_NAME: ${MYSQL_DATABASE:-ecommerce_db}
      DB_PORT: 3306
    volumes:
      - ./web/logs:/app/logs
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  # 2. MySQL 8.0 Relational Database (Isolated in backend-net)
  db:
    image: mysql:8.0
    container_name: ecommerce-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecretPassword2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-shop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ShopUserPass123!}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSecretPassword2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. phpMyAdmin Database Management UI (No public host port)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: ecommerce-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  # 4. Nginx Reverse Proxy (SSL / TLS 1.3 Termination & Security Headers)
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend-net
    depends_on:
      - web
      - phpmyadmin

  # =======================================================
  # Monitoring Stack (Bước 2)
  # =======================================================

  # 5. Prometheus Time-Series Database
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ecommerce-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - frontend-net
      - backend-net

  # 6. Grafana Visualization Dashboard
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ecommerce-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-GrafanaAdminSecure2026!}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - frontend-net
    depends_on:
      - prometheus

  # 7. cAdvisor (Container Resource Metrics - CPU/RAM/Network)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ecommerce-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - frontend-net

  # 8. Node Exporter (Host System Metrics)
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ecommerce-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - frontend-net

  # 9. MySQLd Exporter (Database Performance Metrics)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: ecommerce-mysqld-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${MYSQL_EXPORTER_USER:-exporter}:${MYSQL_EXPORTER_PASSWORD:-ExporterPass123!}@(db:3306)/"
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  # =======================================================
  # Centralized Logging Stack (Bước 3)
  # =======================================================

  # 10. Grafana Loki (Log Aggregation & Indexing Engine)
  loki:
    image: grafana/loki:2.9.8
    container_name: ecommerce-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - frontend-net

  # 11. Promtail (Log Collector & Shipper to Loki)
  promtail:
    image: grafana/promtail:2.9.8
    container_name: ecommerce-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - ./web/logs:/var/log/app:ro
    networks:
      - frontend-net
    depends_on:
      - loki

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  db_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
