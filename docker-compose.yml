version: '3.8'

# =======================================================
# Đề 9 - Website Thương mại điện tử (E-commerce)
# Bước 1: Core Stack (Web, DB, phpMyAdmin, Nginx Reverse Proxy)
# Network Isolation: frontend-net & backend-net
# =======================================================

services:
  # 1. Node.js Express Web Application
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ecommerce-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-shop_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ShopUserPass123!}
      DB_NAME: ${MYSQL_DATABASE:-ecommerce_db}
      DB_PORT: 3306
    volumes:
      - ./web/logs:/app/logs
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  # 2. MySQL 8.0 Relational Database (Isolated in backend-net)
  db:
    image: mysql:8.0
    container_name: ecommerce-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecretPassword2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-shop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ShopUserPass123!}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSecretPassword2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. phpMyAdmin Database Management UI (No public host port)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: ecommerce-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  # 4. Nginx Reverse Proxy (SSL / TLS 1.3 Termination & Security Headers)
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend-net
    depends_on:
      - web
      - phpmyadmin

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: false

volumes:
  db_data:
    driver: local
  nginx_logs:
    driver: local
