# =====================================================================
# Đề 9 - Website Thương mại điện tử (E-commerce) với Docker Compose
# Hệ thống đầy đủ: Web + DB + phpMyAdmin + Nginx + Prometheus + Grafana
# + cAdvisor + Node Exporter + MySQLd Exporter + Nginx Exporter + Loki + Promtail
#
# CÁC BIỆN PHÁP BẢO MẬT & HARDENING:
# 1. Non-root user: Web container chạy dưới user 'node' (UID 1000)
# 2. Resource Limits: Giới hạn CPU và RAM (deploy.resources.limits)
# 3. Network Isolation: Tách riêng frontend-net và backend-net (DB cô lập)
# 4. Port Hardening: Chỉ Nginx (80, 443), Grafana (3000), Prometheus (9090) mở ra host
#    MySQL (3306) đóng hoàn toàn trong backend-net
# 5. .env Isolation: Tách biệt mật khẩu và cấu hình nhạy cảm
# 6. Database Hardening: App chỉ sử dụng user 'shop_user' với quyền DML tối thiểu
# 7. Nginx Security Headers & SSL: Chống XSS, Clickjacking, Sniffing
# =====================================================================

services:
  # 1. Node.js Express Web Application (Non-root user 'node')
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ecommerce-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-shop_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ShopUserPass123!}
      DB_NAME: ${MYSQL_DATABASE:-ecommerce_db}
      DB_PORT: 3306
    volumes:
      - ./web/logs:/app/logs
    ports:
      - "5000:3000"
    networks:
      frontend-net:
        aliases:
          - web
          - backend
      backend-net:
        aliases:
          - web
          - backend
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  # 2. MySQL 8.0 Relational Database (Cô lập trong backend-net, KHÔNG expose port)
  db:
    image: mysql:8.0
    container_name: ecommerce-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecretPassword2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-shop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ShopUserPass123!}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSecretPassword2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 128M

  # 3. phpMyAdmin Database Management UI (Truy cập qua Nginx pma.local hoặc port 8081)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: ecommerce-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # 4. Nginx Reverse Proxy (SSL / TLS 1.3 Termination, Cổng 80/443 mở ra ngoài)
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      frontend-net:
        aliases:
          - nginx
    depends_on:
      - web
      - phpmyadmin
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  # =======================================================
  # Monitoring Stack (Prometheus + Grafana + Exporters)
  # =======================================================

  # 5. Prometheus Time-Series Database
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ecommerce-prometheus
    restart: unless-stopped
    user: "nobody"
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # 6. Grafana Visualization Dashboard
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ecommerce-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-GrafanaAdminSecure2026!}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - frontend-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 7. cAdvisor (Container Resource Metrics - CPU/RAM/Network/Filesystem)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ecommerce-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '--enable_metrics=cpu,memory,network'
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      frontend-net:
        aliases:
          - cadvisor
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # 8. Node Exporter (Host System Metrics)
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ecommerce-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"
    networks:
      frontend-net:
        aliases:
          - node-exporter
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M

  # 9. MySQLd Exporter (Database Performance Metrics)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: ecommerce-mysqld-exporter
    restart: unless-stopped
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=${MYSQL_EXPORTER_USER:-exporter}"
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_EXPORTER_PASSWORD:-ExporterPass123!}"
    ports:
      - "9104:9104"
    networks:
      backend-net:
        aliases:
          - mysqld-exporter
          - mysqld_exporter
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M

  # 10. Nginx Prometheus Exporter (Reverse Proxy & Web Server Metrics)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: ecommerce-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    ports:
      - "9113:9113"
    networks:
      frontend-net:
        aliases:
          - nginx-exporter
          - nginx_exporter
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M

  # =======================================================
  # Centralized Logging Stack (Loki + Promtail)
  # =======================================================

  # 11. Grafana Loki (Log Aggregation & Storage Engine - Non-root)
  loki:
    image: grafana/loki:2.9.8
    container_name: ecommerce-loki
    restart: unless-stopped
    user: "10001:10001"
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      frontend-net:
        aliases:
          - loki
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 12. Promtail (Log Collector & Forwarder)
  promtail:
    image: grafana/promtail:2.9.8
    container_name: ecommerce-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_logs:/var/log/nginx:ro
      - ./web/logs:/var/log/app:ro
    networks:
      - frontend-net
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

volumes:
  db_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
