# =======================================================
# Nginx Reverse Proxy Configuration (Đề 9 E-Commerce)
# Routing: shop.local -> web:3000, pma.local -> phpmyadmin:80
# Hardening: SSL/TLS 1.2/1.3, Security Headers, Port 80 -> 443
# =======================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format for Promtail and Loki log analytics
    log_format  custom_json  escape=json
        '{"time_local":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log  custom_json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Security Hardening: Hide Nginx version

    # Upstream Services
    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    upstream pma_upstream {
        server phpmyadmin:80;
        keepalive 16;
    }

    # =======================================================
    # 0. Internal Status Endpoint for Prometheus Nginx Exporter
    # =======================================================
    server {
        listen 8080;
        server_name localhost nginx;

        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }

    # =======================================================
    # 1. HTTP Server - Redirect domains to HTTPS 443
    # =======================================================
    server {
        listen 80;
        listen [::]:80;
        server_name shop.local pma.local;

        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP Localhost fallback for instant browser testing without SSL warning
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost "";

        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =======================================================
    # 2. HTTPS Server - shop.local (E-Commerce Web Application)
    # =======================================================
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name shop.local localhost "";

        # SSL Configuration
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # =======================================================
        # Security Headers (Hardening Requirements)
        # =======================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://images.unsplash.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }

    # =======================================================
    # 3. HTTPS Server - pma.local (phpMyAdmin Management Interface)
    # =======================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name pma.local;

        # SSL Configuration
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://pma_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 64M; # Support large SQL dump imports
        }
    }
}
